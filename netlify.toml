# Bundled Masterview copy: revalidate so phones pick up a new one on the next deploy
[[headers]]
  for = "/imagedb.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Service worker + shell must always revalidate so a deploy is picked up promptly
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
